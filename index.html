
 <!DOCTYPE html>
 <html lang="pl">
 
 <head>
     <meta charset="UTF-8">
    <title>Countdown Timer</title>
     <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        #timer {
            font-size: 5em;
            margin-bottom: 20px;
        }
        #startButton {
            font-size: 3em;
            padding: 20px 40px;
            background-color: #00bc06;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        #startButton:hover {
            background-color: #00ff0d;
        }
        #startButton:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        #progressBar {
            width: 300px;
            height: 30px;
            background-color: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 2px solid #999;
        }
        #progressFill {
            height: 100%;
            background-color: #4CAF50;
            width: 100%;
            transition: width 0.05s linear;
        }
        input[type="radio"] {
            transform: scale(1.5);
            margin: 10px;
        }
        label {
            font-size: 1.5em;
            margin-right: 20px;
        }
     </style>
 </head>
<body>
    <div id="progressBar">
        <div id="progressFill"></div>
    </div>
    <div id="timer">10</div>
    <div>
        <input type="radio" id="5s" name="duration" value="5000">
        <label for="5s">5 seconds</label>
        <input type="radio" id="10s" name="duration" value="10000" checked>
        <label for="10s">10 seconds</label>
        <input type="radio" id="15s" name="duration" value="15000">
        <label for="15s">15 seconds</label>
    </div>
    <button id="startButton">Start Countdown</button>

    <script>
        let countdown;
        let timeLeftMs = 10000;
        let lastAlertTime = 0;
        const timerDisplay = document.getElementById('timer');
        const startButton = document.getElementById('startButton');
        const progressFill = document.getElementById('progressFill');
        let totalTime = 10000;

        function formatTime(ms) {
            const seconds = Math.floor(ms / 1000);
            const milliseconds = ms % 1000;
            return `${seconds}.${String(Math.floor(milliseconds / 10)).padStart(2, '0')}`;
        }

        startButton.addEventListener('click', () => {
            if (countdown) return; 
            const selectedDuration = document.querySelector('input[name="duration"]:checked').value;
            totalTime = parseInt(selectedDuration);
            timeLeftMs = totalTime;
            timerDisplay.textContent = formatTime(timeLeftMs);
            progressFill.style.width = '100%';
            progressFill.style.backgroundColor = 'hsl(120, 100%, 50%)';
            startButton.disabled = true;
            countdown = setInterval(() => {
                timeLeftMs -= 50;
                timerDisplay.textContent = formatTime(timeLeftMs);
                const progressPercent = (timeLeftMs / totalTime) * 100;
                progressFill.style.width = progressPercent + '%';
                progressFill.style.backgroundColor = `hsl(${120 * (progressPercent / 100)}, 100%, 50%)`;
                if (timeLeftMs <= 0) {
                    clearInterval(countdown);
                   countdown = null;
                    startButton.disabled = false;
                    speakAlert('Countdown finished!');
                }
            }, 50);
        });

        function speakAlert(text) {
            const now = Date.now();

            if (now - lastAlertTime < 5000) return;
            lastAlertTime = now;

            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'en-US';
            msg.rate = 0.9;
            msg.pitch = 1;
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(msg);
        }
        
    </script>
</body>
 </html>
